version: '3.8'

services:
  smartlab-website:
    build:
      context: .
      args:
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:-http://localhost:8090}
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - smartlab-network

networks:
  smartlab-network:
    driver: bridge
